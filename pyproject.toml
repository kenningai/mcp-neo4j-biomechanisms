[project]
name = "mcp-neo4j-biomechanisms"
version = "0.3.0"
description = "Empirical Neuroscience Knowledge Graph MCP Server — how conscious experience is expressed in biological substrate"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.0,<4",
    "neo4j>=5.26.0",
    "pydantic>=2.10.1",
    "starlette>=0.28.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.389",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "testcontainers[neo4j]>=4.10.0",
    "aiohttp>=3.8.0",
]

[project.scripts]
mcp-neo4j-biomechanisms = "mcp_neo4j_biomechanisms:main"

[tool.seal]
publish = "pypi"
test = [
  "uv run pytest tests/unit",
]

[tool.pytest.ini_options]
pythonpath = [
    "src"
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_neo4j_biomechanisms"]

[tool.hatch.build.targets.sdist]
# Default-deny: name what ships. An exclude list only ever omits what someone
# thought of, and the sdist is built from the working tree — anything sitting
# in the directory is a candidate for publication.
include = [
    "src/mcp_neo4j_biomechanisms",
    "tests",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
    "HOWTO.xml",
    "Dockerfile",
    "compose.yml",
    "pyproject.toml",
    "uv.lock",
]
