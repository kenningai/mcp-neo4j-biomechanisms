[project]
name = "mcp-neo4j-biomechanisms"
version = "0.2.0"
description = "Empirical Neuroscience Knowledge Graph MCP Server — how conscious experience is expressed in biological substrate"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.0,<4",
    "neo4j>=5.26.0",
    "pydantic>=2.10.1",
    "starlette>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.389",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "testcontainers[neo4j]>=4.10.0",
    "aiohttp>=3.8.0",
]

[project.scripts]
mcp-neo4j-biomechanisms = "mcp_neo4j_biomechanisms:main"

[tool.pytest.ini_options]
pythonpath = [
    "src"
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_neo4j_biomechanisms"]
